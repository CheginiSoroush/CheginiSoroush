# Daily self-update sync for the imsoroush.ir site.
#
# Runs the same pipeline as the deploy-time sync (deploy/auto-sync.sh) on a
# schedule so brand-new repos get catalog cards, newly-deployed Workers get
# demo links, and demo uptime stays fresh — without any push.
#
# Repository secrets (already present for the deploy workflow):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GH_PAT
name: Auto Sync

on:
  schedule:
    # 20:00 UTC = 23:30 Tehran — once a day, after the working day
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: auto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run auto-sync (GitHub → Cloudflare D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: bash deploy/auto-sync.sh
