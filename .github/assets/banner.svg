<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Soroush Chegini — سروش چگینی · Software Developer">
  <title>Soroush Chegini — سروش چگینی</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#0e1628"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14d2b8">
        <animate attributeName="stop-color" values="#14d2b8;#7c5cff;#e879f9;#14d2b8" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#7c5cff">
        <animate attributeName="stop-color" values="#7c5cff;#e879f9;#14d2b8;#7c5cff" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#e879f9">
        <animate attributeName="stop-color" values="#e879f9;#14d2b8;#7c5cff;#e879f9" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14d2b8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#14d2b8"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;0;1;-1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shoot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur60" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blur30" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="frame">
      <rect width="1000" height="280" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- base -->
    <rect width="1000" height="280" fill="url(#bg)"/>

    <!-- aurora blobs -->
    <g filter="url(#blur60)" opacity="0.5">
      <ellipse cx="170" cy="250" rx="270" ry="150" fill="#14d2b8" opacity="0.75">
        <animateTransform attributeName="transform" type="translate" values="0 0; 130 -35; 0 0" dur="16s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="840" cy="50" rx="290" ry="160" fill="#7c5cff" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0 0; -120 40; 0 0" dur="19s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="510" cy="330" rx="320" ry="150" fill="#e879f9" opacity="0.4">
        <animateTransform attributeName="transform" type="translate" values="0 0; -70 -45; 0 0" dur="22s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- starfield -->
    <g fill="#cfe9ff">
      <circle cx="80"  cy="52"  r="1.6"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="130" r="1.1" opacity="0.5"/>
      <circle cx="235" cy="40"  r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="95"  r="1"   opacity="0.55"/>
      <circle cx="405" cy="30"  r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="150" r="1.1" opacity="0.4"/>
      <circle cx="560" cy="48"  r="1.4"><animate attributeName="opacity" values="1;0.25;1" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="645" cy="115" r="1"   opacity="0.5"/>
      <circle cx="720" cy="35"  r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="140" r="1.2" opacity="0.45"/>
      <circle cx="880" cy="70"  r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="945" cy="120" r="1"   opacity="0.5"/>
      <circle cx="60"  cy="200" r="1.2" opacity="0.35"/>
      <circle cx="940" cy="220" r="1.3" opacity="0.35"/>
    </g>

    <!-- shooting star -->
    <g opacity="0">
      <rect x="-140" y="-2" width="110" height="2.4" rx="1.2" fill="url(#shoot)"/>
      <circle cx="-32" cy="-1" r="2.4" fill="#ffffff"/>
      <animateMotion path="M -120 30 L 1140 210" dur="7s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.45;1" dur="7s" begin="2s" repeatCount="indefinite"/>
    </g>

    <!-- orbit systems (left + right) -->
    <g transform="translate(88 140)">
      <circle r="46" fill="none" stroke="#14d2b8" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 6"/>
      <circle r="4" fill="#14d2b8" filter="url(#blur30)" opacity="0.8"/>
      <circle r="4" fill="#14d2b8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.2" fill="#7c5cff" cx="46">
        <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(912 140)">
      <circle r="46" fill="none" stroke="#7c5cff" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 6"/>
      <circle r="4" fill="#7c5cff">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.2" fill="#14d2b8" cx="46">
        <animateTransform attributeName="transform" type="rotate" from="120" to="-240" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- headline -->
    <text x="500" y="122" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#brandGrad)" letter-spacing="1">Soroush Chegini</text>
    <text x="500" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="30" font-weight="600" fill="#8ff2e3">سروش چگینی</text>
    <text x="500" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#93a1c4" letter-spacing="4">SOFTWARE DEVELOPER · TELEGRAM BOT MAKER · 3D BUILDER · WRITER</text>

    <!-- hairline -->
    <rect x="280" y="246" width="440" height="2" rx="1" fill="url(#hairline)"/>
  </g>
</svg>
