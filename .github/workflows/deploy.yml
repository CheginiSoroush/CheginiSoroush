# Cloudflare Workers deployment (GitHub Actions) — thin wrapper.
#
# All pipeline logic lives in deploy/ci-deploy.sh (version-controlled), so
# future fixes only need a normal push to main. This file should rarely
# change. It lives at deploy/github-actions-deploy.yml because pushing to
# .github/workflows requires the `workflow` token scope — install it once:
#   GitHub → Actions tab → "set up a workflow yourself" → name it deploy.yml
#   → paste this file's content → Commit changes (the push starts run #1).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   Required:  CLOUDFLARE_API_TOKEN  ("Edit Cloudflare Workers" template
#                                    + Account → D1 → Edit permission)
#              CLOUDFLARE_ACCOUNT_ID
#   Optional:  ADMIN_KEY  (admin panel key; falls back to code default)
#              GH_PAT     (fine-grained PAT: All repositories + Metadata read;
#                          powers /api/github + /api/repos incl. private repos)
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy (verify token → D1 → build → worker → secrets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_KEY_VALUE: ${{ secrets.ADMIN_KEY }}
          GH_PAT_VALUE: ${{ secrets.GH_PAT }}
        run: bash deploy/ci-deploy.sh
